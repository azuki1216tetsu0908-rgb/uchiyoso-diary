<script type="module">
window.__faceDetectorPromise = null;
window.loadFaceDetector = async function(){
  if(window.__faceDetectorPromise) return window.__faceDetectorPromise;
  window.__faceDetectorPromise = (async()=>{
    const vision = await import("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22");
    const fileset = await vision.FilesetResolver.forVisionTasks(
      "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/wasm"
    );
    return vision.FaceDetector.createFromOptions(fileset,{
      baseOptions:{
        modelAssetPath:"https://storage.googleapis.com/mediapipe-models/face_detector/blaze_face_short_range/float16/1/blaze_face_short_range.tflite",
        delegate:"GPU"
      },
      runningMode:"IMAGE",
      minDetectionConfidence:0.35
    });
  })();
  return window.__faceDetectorPromise;
};
window.detectFaceFocalPoint = async function(file){
  try{
    const detector=await window.loadFaceDetector();
    const bitmap=await createImageBitmap(file);
    const result=detector.detect(bitmap);
    bitmap.close();
    const detections=result?.detections||[];
    if(!detections.length) return null;
    let sx=0,sy=0,total=0;
    for(const d of detections){
      const b=d.boundingBox;
      if(!b) continue;
      const score=(d.categories?.[0]?.score)||1;
      sx+=(b.originX+b.width/2)*score;
      sy+=(b.originY+b.height*0.58)*score;
      total+=score;
    }
    if(!total) return null;
    return {
      x:Math.max(0,Math.min(100,sx/total/bitmap.width*100)),
      y:Math.max(0,Math.min(100,sy/total/bitmap.height*100)),
      faces:detections.length
    };
  }catch(e){
    console.warn("face focus detection failed",e);
    return null;
  }
};
</script>

<script>
const PAIR_KEY='uchiyoso_pairs_v1', CHAR_KEY='uchiyoso_characters_v1', GALLERY_KEY='uchiyoso_gallery_v1';
const APP_PROFILE_KEY='uchiyoso_profile_v1', APP_NOTIFY_KEY='uchiyoso_notifications_v1';
const WORKSPACE_KEY='uchiyoso_workspace_v1';
let currentWorkspace=JSON.parse(localStorage.getItem(WORKSPACE_KEY)||'null');

let appProfile=JSON.parse(localStorage.getItem(APP_PROFILE_KEY)||'null')||{displayName:'',memo:''};
let appNotifications=JSON.parse(localStorage.getItem(APP_NOTIFY_KEY)||'null')||{anniversaryReminder:true,reminderDays:7};

const SB_CONFIG_KEY='uchiyoso_supabase_config_v1';
let supabaseClient=null, authMode='login', currentUser=null, appReady=false;
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function getSupabaseConfig(){try{return JSON.parse(localStorage.getItem(SB_CONFIG_KEY)||'null')}catch(e){return null}}
function setAuthMessage(id,msg){const el=document.getElementById(id);if(!el)return;el.textContent=msg;el.style.display=msg?'block':'none'}
function setAuthMode(mode){authMode=mode;document.getElementById('loginTab')?.classList.toggle('active',mode==='login');document.getElementById('signupTab')?.classList.toggle('active',mode==='signup');document.getElementById('authSubmit').textContent=mode==='login'?'ログイン':'新規登録';document.getElementById('authHelp').textContent=mode==='login'?'登録済みのアカウントでログインします。':'新しいアカウントを作成します。メール確認が必要な場合があります。';setAuthMessage('authMsg','')}
function showAuthConfig(){document.getElementById('authGate').style.display='flex';document.getElementById('authConfigStep').style.display='block';document.getElementById('authLoginStep').style.display='none';const c=getSupabaseConfig();if(c){document.getElementById('sbUrl').value=c.url||'';document.getElementById('sbKey').value=c.key||''}}
function showAuthLogin(){document.getElementById('authConfigStep').style.display='none';document.getElementById('authLoginStep').style.display='block'}
async function initSupabase(){
  if(!window.supabase?.createClient) throw new Error('Supabaseライブラリを読み込めませんでした。ネット接続を確認してください。');
  const c=getSupabaseConfig();
  if(!c?.url||!c?.key){showAuthConfig();return false}
  try{
    // 接続設定画面ではネットワーク確認のためにgetSession()を待たない。
    // GitHub Pages上でセッション確認がハングすると、設定画面から進めなくなるため。
    supabaseClient=window.supabase.createClient(c.url,c.key,{auth:{autoRefreshToken:true,persistSession:true,detectSessionInUrl:true}});
    supabaseClient.auth.onAuthStateChange((_event,session)=>{currentUser=session?.user||null;updateAuthGate();});
    currentUser=null;
    updateAuthGate();
    // 保存済みセッションがある場合だけ、短いタイムアウトで復元を試みる。
    const sessionPromise=supabaseClient.auth.getSession();
    const timeoutPromise=new Promise(resolve=>setTimeout(()=>resolve({data:{session:null},error:null}),3000));
    const result=await Promise.race([sessionPromise,timeoutPromise]);
    if(result?.error) throw result.error;
    currentUser=result?.data?.session?.user||null;
    updateAuthGate();
    return true;
  }catch(e){setAuthMessage('configMsg','Supabaseの接続確認に失敗しました：'+(e.message||e));showAuthConfig();return false}
}
function updateAuthGate(){
  const gate=document.getElementById('authGate');
  if(!gate)return;
  if(currentUser){
    gate.style.display='none';
    // 初回ログイン時だけホームを表示。
    // メール確認・トークン更新などのAuthイベントでは現在の画面を維持する。
    if(!appReady){appReady=true;show('home');}
  }else{
    appReady=false;
    gate.style.display='flex';
    showAuthLogin();
  }
}
async function saveSupabaseConfig(){
  const url=document.getElementById('sbUrl').value.trim().replace(/\/$/,'');const key=document.getElementById('sbKey').value.trim();
  if(!/^https:\/\/[^\s]+\.supabase\.co$/.test(url)){setAuthMessage('configMsg','Project URLの形式を確認してね。');return}
  if(!key){setAuthMessage('configMsg','Publishable keyを入力してね。');return}
  if(/^sb_secret_|service_role/i.test(key)){setAuthMessage('configMsg','Secret key / service_role key はここには入力しないでください。');return}
  localStorage.setItem(SB_CONFIG_KEY,JSON.stringify({url,key}));
  const ok=await initSupabase();if(ok)toast('Supabaseに接続しました');
}
function resetSupabaseConfig(){if(!confirm('このブラウザのSupabase接続設定を削除しますか？'))return;localStorage.removeItem(SB_CONFIG_KEY);supabaseClient=null;currentUser=null;showAuthConfig();}
async function submitAuth(){
  if(!supabaseClient){setAuthMessage('authMsg','先にSupabase接続設定をしてください。');return}
  const email=document.getElementById('authEmail').value.trim();const password=document.getElementById('authPassword').value;
  if(!email||!password){setAuthMessage('authMsg','メールアドレスとパスワードを入力してね。');return}
  if(password.length<6){setAuthMessage('authMsg','パスワードは6文字以上にしてね。');return}
  setAuthMessage('authMsg','処理中…');
  try{
    if(authMode==='signup'){
      const {data,error}=await supabaseClient.auth.signUp({email,password});
      if(error)throw error;

function openGalleryDB(){
  return new Promise((resolve,reject)=>{
    const req=indexedDB.open(GALLERY_DB,1);
    req.onupgradeneeded=()=>{const db=req.result;if(!db.objectStoreNames.contains(GALLERY_STORE))db.createObjectStore(GALLERY_STORE)};
    req.onsuccess=()=>resolve(req.result); req.onerror=()=>reject(req.error);
  });
}
async function putGalleryBlob(id,blob){
  const db=await openGalleryDB();
  return new Promise((resolve,reject)=>{
    const tx=db.transaction(GALLERY_STORE,'readwrite');tx.objectStore(GALLERY_STORE).put(blob,id);
    tx.oncomplete=()=>{db.close();resolve()};tx.onerror=()=>{db.close();reject(tx.error)};
  });
}
async function getGalleryBlob(id){
  const db=await openGalleryDB();
  return new Promise((resolve,reject)=>{
    const tx=db.transaction(GALLERY_STORE,'readonly');const req=tx.objectStore(GALLERY_STORE).get(id);
    req.onsuccess=()=>resolve(req.result||null);req.onerror=()=>reject(req.error);
    tx.oncomplete=()=>db.close();
  });
}
async function deleteGalleryBlob(id){

  return new Promise((resolve,reject)=>{

async function loadWorkspace(){
  if(!supabaseClient||!currentUser){currentWorkspace=null;return null;}
  if(currentWorkspace?.id&&currentWorkspace.owner_id){
    return currentWorkspace;
  }
  try{
    const {data,error}=await supabaseClient
      .from('workspace_members')
      .select('workspace_id,role,workspaces(id,name,invite_code,owner_id)')
      .eq('user_id',currentUser.id)
      .limit(1)
      .maybeSingle();
    if(error)throw error;
    const w=data?.workspaces||null;
    if(w){
      currentWorkspace=w;
      localStorage.setItem(WORKSPACE_KEY,JSON.stringify(w));
      return w;
    }
  }catch(e){
    console.error('ワークスペース取得エラー:',e);
  }
  return null;
}
async function createWorkspace(){
  if(!supabaseClient||!currentUser){toast('先にログインしてください');return;}
  const name=(document.getElementById('workspaceName')?.value||'うちよそ日記').trim()||'うちよそ日記';
  const btn=document.getElementById('createWorkspaceBtn');
  if(btn)btn.disabled=true;
  try{
    const {data,error}=await supabaseClient
      .from('workspaces')
      .insert({name,owner_id:currentUser.id})
      .select('id,name,invite_code,owner_id')
      .single();
    if(error)throw error;
    currentWorkspace=data;
    localStorage.setItem(WORKSPACE_KEY,JSON.stringify(data));
    toast('ワークスペースを作成しました');
    showWorkspaceSettings();
  }catch(e){
    console.error(e);
    toast('ワークスペースの作成に失敗しました');
    const m=document.getElementById('workspaceMsg');
    if(m)m.textContent=e.message||String(e);
  }finally{
    if(btn)btn.disabled=false;
  }
}
async function joinWorkspace(){
  if(!supabaseClient||!currentUser){toast('先にログインしてください');return;}
  const code=(document.getElementById('inviteCode')?.value||'').trim().toUpperCase();
  if(!code){toast('招待コードを入力してください');return;}
  const btn=document.getElementById('joinWorkspaceBtn');
  if(btn)btn.disabled=true;
  try{
    const {data,error}=await supabaseClient.rpc('join_workspace_by_code',{p_invite_code:code});
    if(error)throw error;
    const w=Array.isArray(data)?data[0]:data;
    if(!w?.id)throw new Error('ワークスペースを確認できませんでした');
    currentWorkspace=w;
    localStorage.setItem(WORKSPACE_KEY,JSON.stringify(w));
    toast('ワークスペースに参加しました');
    showWorkspaceSettings();
  }catch(e){
    console.error(e);
    const m=document.getElementById('workspaceMsg');
    if(m)m.textContent=e.message||'招待コードを確認してください。';
  }finally{
    if(btn)btn.disabled=false;
  }
}

function applyGalleryObjectPosition(img,focusX,focusY){
  if(!img||!img.naturalWidth||!img.naturalHeight)return;
  const cw=img.clientWidth,ch=img.clientHeight;
  if(!cw||!ch)return;
  const scale=Math.max(cw/img.naturalWidth,ch/img.naturalHeight);
  const ow=img.naturalWidth*scale,oh=img.naturalHeight*scale;
  const fx=Math.max(0,Math.min(100,Number.isFinite(focusX)?focusX:50))/100;
  const fy=Math.max(0,Math.min(100,Number.isFinite(focusY)?focusY:50))/100;
  const px=Math.abs(ow-cw)<0.01?50:Math.max(0,Math.min(100,(fx*ow-cw/2)/(ow-cw)*100));
  const py=Math.abs(oh-ch)<0.01?50:Math.max(0,Math.min(100,(fy*oh-ch/2)/(oh-ch)*100));
  img.style.objectPosition=`${px}% ${py}%`;
}

  for(const x of items){
    try{const blob=await getGalleryBlob(x.id);if(blob){const url=URL.createObjectURL(blob);const img=document.getElementById('gimg-'+x.id);if(img){img.onload=()=>{applyGalleryObjectPosition(img,x.focusX,x.focusY);URL.revokeObjectURL(url)};img.src=url;if(img.complete)applyGalleryObjectPosition(img,x.focusX,x.focusY)}}}catch(e){}
  }
}

async function openGalleryFocusEditor(id){

  <div class="focus-stage-wrap"><div class="focus-stage" id="focusStage"><img id="focusEditorImg" src="${url}" alt=""><div class="focus-frame" id="focusFrame"></div></div></div>
  <div class="focus-help">タップした場所に枠の中心を移動することもできます。</div>
  <div class="focus-coords" id="focusCoords"></div>
  <button class="primary" onclick="saveGalleryFocus('${id}')">この位置で決定</button>
  <button class="secondary" onclick="closeFocusEditor()">キャンセル</button>`;
  document.getElementById('modal').style.display='flex';
  const img=document.getElementById('focusEditorImg');
  img.onload=()=>setupFocusEditor(id);
  if(img.complete) setupFocusEditor(id);

}
function setupFocusEditor(id){
  const st=focusEditorState;if(!st||st.id!==id)return;
  const stage=document.getElementById('focusStage'),img=document.getElementById('focusEditorImg'),frame=document.getElementById('focusFrame');
  if(!stage||!img||!frame)return;
  const w=img.getBoundingClientRect().width,h=img.getBoundingClientRect().height;
  if(!w||!h)return;
  st.side=Math.min(w,h);st.maxLeft=Math.max(0,w-st.side);st.maxTop=Math.max(0,h-st.side);
  const x=Number.isFinite(gallery.find(g=>g.id===id)?.focusX)?gallery.find(g=>g.id===id).focusX:50;
  const y=Number.isFinite(gallery.find(g=>g.id===id)?.focusY)?gallery.find(g=>g.id===id).focusY:50;
  const left=Math.max(0,Math.min(st.maxLeft,w*x/100-st.side/2));
  const top=Math.max(0,Math.min(st.maxTop,h*y/100-st.side/2));
  frame.style.width=st.side+'px';frame.style.height=st.side+'px';frame.style.left=left+'px';frame.style.top=top+'px';
  updateFocusCoords();
  frame.onpointerdown=(e)=>{
    e.preventDefault();st.dragging=true;st.startX=e.clientX;st.startY=e.clientY;st.startLeft=parseFloat(frame.style.left)||0;st.startTop=parseFloat(frame.style.top)||0;frame.setPointerCapture?.(e.pointerId);
  };
  frame.onpointermove=(e)=>{
    if(!st.dragging)return;e.preventDefault();
    const nx=Math.max(0,Math.min(st.maxLeft,st.startLeft+e.clientX-st.startX));
    const ny=Math.max(0,Math.min(st.maxTop,st.startTop+e.clientY-st.startY));
    frame.style.left=nx+'px';frame.style.top=ny+'px';updateFocusCoords();
  };
  const stop=()=>{st.dragging=false};
  frame.onpointerup=stop;frame.onpointercancel=stop;frame.onlostpointercapture=stop;
  stage.onclick=(e)=>{
    if(st.dragging)return;
    if(e.target===frame||frame.contains(e.target))return;
    const r=stage.getBoundingClientRect();
    const cx=e.clientX-r.left,cy=e.clientY-r.top;
    const nx=Math.max(0,Math.min(st.maxLeft,cx-st.side/2));
    const ny=Math.max(0,Math.min(st.maxTop,cy-st.side/2));
    frame.style.left=nx+'px';frame.style.top=ny+'px';updateFocusCoords();
  };
}
function updateFocusCoords(){
  const st=focusEditorState,frame=document.getElementById('focusFrame'),coords=document.getElementById('focusCoords');if(!st||!frame||!coords)return;
  const img=document.getElementById('focusEditorImg');const w=img?.getBoundingClientRect().width||0,h=img?.getBoundingClientRect().height||0;
  if(!w||!h)return;
  const cx=(parseFloat(frame.style.left)||0)+st.side/2;const cy=(parseFloat(frame.style.top)||0)+st.side/2;
  coords.textContent=`表示位置：${Math.round(cx/w*100)}% / ${Math.round(cy/h*100)}%`;
}

  const x=gallery.find(g=>g.id===id),st=focusEditorState,frame=document.getElementById('focusFrame'),img=document.getElementById('focusEditorImg');if(!x||!st||!frame||!img)return;

  const left=parseFloat(frame.style.left)||0,top=parseFloat(frame.style.top)||0;
  x.focusX=Math.max(0,Math.min(100,(left+st.side/2)/w*100));x.focusY=Math.max(0,Math.min(100,(top+st.side/2)/h*100));x.focusManual=true;x.faceCount=0;saveGalleryMeta();

function saveCharacterEdit(){const id=window.editingCharacterId,c=characters.find(x=>x.id===id);if(!c)return;const prev=cloneStats(c.stats||[]),nextStats=parseSimpleList(document.getElementById('editStats')?.value||'');c.name=document.getElementById('editName')?.value.trim()||c.name;c.job=document.getElementById('editJob')?.value.trim()||'';c.age=document.getElementById('editAge')?.value.trim()||c.age;c.latestAge=document.getElementById('editLatestAge')?.value.trim()||'';c.gender=document.getElementById('editGender')?.value.trim()||'';c.weight=document.getElementById('editWeight')?.value.trim()||'';c.birthplace=document.getElementById('editBirthplace')?.value.trim()||'';c.hair=document.getElementById('editHair')?.value.trim()||'';c.eyes=document.getElementById('editEyes')?.value.trim()||'';c.firstPerson=document.getElementById('editFirst')?.value.trim()||'';c.secondPerson=document.getElementById('editSecond')?.value.trim()||'';c.latestHeight=document.getElementById('editLatestHeight')?.value.trim()||'';c.latestProfile=document.getElementById('editLatestProfile')?.value||'';c.birthday=document.getElementById('editBirthday')?.value.trim()||'';const hue=Number(document.getElementById('editHue')?.value);if(Number.isFinite(hue))c.imageColorHue=hue;c.imageColor=hueToColor(c.imageColorHue??270);c.likes=document.getElementById('editLikes')?.value||'';c.dislikes=document.getElementById('editDislikes')?.value||'';c.iconUrls=(document.getElementById('editIcons')?.value||'').split(/\n/).map(x=>x.trim()).filter(Boolean);c.memo=document.getElementById('editMemo')?.value||'';c.quotes=(document.getElementById('editQuotes')?.value||'').split(/\n/).map(x=>x.trim()).filter(Boolean).map(x=>x.replace(/^「|」$/g,''));c.sanCurrent=document.getElementById('editSanCurrent')?.value.trim()||'';c.sanMax=document.getElementById('editSanMax')?.value.trim()||'';if(!sameStats(prev,nextStats)){c.statsHistory=Array.isArray(c.statsHistory)?c.statsHistory:[];c.statsHistory.push({at:new Date().toISOString(),stats:cloneStats(nextStats)})}c.stats=nextStats;c.skills=collectSkills();const r=getPartnerRelation(c);r.partnerName=document.getElementById('editPartnerName')?.value.trim()||'';r.position=document.getElementById('editPartnerPosition')?.value||'未定';r.callName=document.getElementById('editPartnerCall')?.value.trim()||'';r.secondPerson=document.getElementById('editPartnerSecond')?.value.trim()||'';r.thirdPersonCall=document.getElementById('editPartnerThirdCall')?.value.trim()||'';r.partnerPersonality=document.getElementById('editPartnerPersonality')?.value||'';r.otherPeople=(window.editingOtherPeople||[]).map(x=>({target:String(x.target||'').trim(),memo:String(x.memo||'')})).filter(x=>x.target||x.memo);c.initialData=c.initialData||{};c.initialData.age=c.initialData.age??c.age;c.initialData.height=c.initialData.height??c.height;c.initialStats=Array.isArray(c.initialStats)?c.initialStats:cloneStats(c.stats);save();closeModal();toast('変更を保存しました');characterDetail(id)}
function parseSimpleList(text){return String(text||'').split('\n').map(x=>x.trim()).filter(Boolean).map(line=>{const m=line.match(/^(.+?)\s+(\d+)$/);return m?{name:m[1].trim(),value:m[2]}:{name:line,value:''}})}
function cloneStats(list){return (Array.isArray(list)?list:[]).map(x=>({name:String(x?.name||''),value:String(x?.value??'')}))}
function sameStats(a,b){return JSON.stringify(cloneStats(a))===JSON.stringify(cloneStats(b))}
function formatHistoryDate(iso){try{return new Date(iso).toLocaleString('ja-JP',{year:'numeric',month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})}catch(e){return iso||'日時不明'}}
function skillDetailHtml(c){const skills=normalizeSkills(c.skills||[]);const groups=[...SKILL_GROUPS,'その他'];const body=groups.map(group=>{const rows=skills.filter(x=>x.category===group).map(x=>{const iv=x.initialValue??x.value??'';const cv=x.value??'';const chain=iv!==''&&cv!==''&&iv!==cv?`${esc(iv)} <span style="opacity:.45">→</span> <strong>${esc(cv)}</strong>`:`<strong>${esc(cv||iv||'—')}</strong>`;return `<tr><td>${esc(x.name)}</td><td>${chain}</td></tr>`}).join('');return rows?`<div class="skill-group"><div class="skill-group-title">${esc(group)}</div><table class="skill-table">${rows}</table></div>`:''}).join('');return `<div class="detail-block"><div class="detail-title">技能</div><div class="skill-groups">${body}</div></div>`}
function statsCurrentHtml(c){const initial=cloneStats(c.initialStats||c.initialData?.stats||[]), history=Array.isArray(c.statsHistory)?c.statsHistory:[], current=cloneStats(c.stats||[]); if(!current.length&&!initial.length)return ''; const names=[]; [...initial,...current,...history.flatMap(h=>Array.isArray(h.stats)?h.stats:[])].forEach(x=>{if(x?.name&&!names.includes(x.name))names.push(x.name)}); const getVal=(list,name)=>{const x=list.find(v=>v.name===name);return x?String(x.value??''):''}; const makeItems=(groupNames)=>groupNames.map(name=>{const values=[]; let last=getVal(initial,name); if(last!=='')values.push(last); for(const h of history){const v=getVal(h.stats||[],name); if(v!==''&&v!==last){values.push(v);last=v}} const cur=getVal(current,name); if(cur!==''&&cur!==last)values.push(cur); if(!values.length&&cur==='')return ''; const chain=values.length>1?values.map((v,i)=>i===values.length-1?`<strong>${esc(v)}</strong>`:esc(v)).join(' <span style="opacity:.45">→</span> '):`<strong>${esc(cur||values[0]||'—')}</strong>`; return `<div class="stat-item"><div class="stat-name">${esc(name)}</div><div class="stat-value">${chain}</div></div>`}).filter(Boolean).join(''); const block=(title,groupNames)=>{const items=makeItems(groupNames); if(!items)return ''; return `<div class="detail-block"><div class="detail-title">${title}</div><div class="card"><div class="stat-grid">${items}</div></div></div>`}; const first=['STR','CON','POW','DEX','APP','SIZ','INT','EDU']; const second=['HP','MP','IDE','幸運','知識']; const used=new Set([...first,...second]); const extra=names.filter(n=>!used.has(n)); let html=block('能力値（STR〜EDU）',first)+block('能力値（HP〜知識）',second); if(extra.length)html+=block('その他の能力値',extra); return html}

function openCharacterModal(pairId){if(pairId!==undefined)currentPairId=pairId;document.getElementById('sheet').innerHTML=`<button class="close" onclick="closeModal()">×</button><h2>キャラクターを追加</h2><div class="note">いあきゃらの「テキスト出力」で保存した .txt ファイルを選んでください。読み込んだ内容は確認後に登録します。</div><div class="field"><label>いあきゃらテキスト</label><input id="charFile" type="file" accept=".txt,text/plain" onchange="handleCharFile(event)"><div class="file-name" id="fileName"></div></div><div id="importPreview"></div>`;document.getElementById('modal').style.display='flex'}
function handleCharFile(e){let f=e.target.files?.[0];if(!f)return;document.getElementById('fileName').textContent=f.name;let r=new FileReader();r.onload=()=>{let c=parseIaChara(String(r.result||''));window.pendingCharacter=c;renderImportPreview(c)};r.readAsText(f)}
function parseIaChara(text){let lines=text.replace(/\r/g,'').split('\n');let get=(label)=>{let re=new RegExp('(?:^|/)\\s*'+label.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\s*:\s*([^/\\r\\n]*)');for(const raw of lines){let m=raw.match(re);if(m)return m[1].trim()}return ''};let name=get('名前');let job=get('職業');let basicLine=lines.find(x=>x.trim().startsWith('年齢:'))||'';let field=(label,line)=>{let re=new RegExp('(?:^|/)\\s*'+label.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\s*:\s*([^/\\r\\n]*)');let m=String(line||'').match(re);return m?m[1].trim():''};let age=field('年齢',basicLine);let gender=field('性別',basicLine);let heightRaw=field('身長',basicLine);let directHeight=(heightRaw.match(/\d+(?:\.\d+)?/)||[''])[0];let c={id:Date.now()+Math.floor(Math.random()*1000),name,tag:get('タグ'),job,age,gender,height:directHeight,weight:get('体重'),birthplace:get('出身'),hair:'',eyes:'',skin:'',iconUrls:[],firstPerson:'',secondPerson:'',birthday:'',imageColorHue:270,imageColor:hueToColor(270),pairRelations:{},memo:'',quotes:[],stats:[],sanCurrent:'',sanMax:'',skills:[],pairIds:[currentPairId],source:'iachara_text_v6',latestAge:age,latestProfile:'',initialData:null};
let appearanceLine=lines.find(x=>x.trim().startsWith('髪の色:'))||'';c.hair=field('髪の色',appearanceLine);c.eyes=field('瞳の色',appearanceLine);c.skin=field('肌の色',appearanceLine);
let inIcon=false;for(const line of lines){let t=line.trim();if(t==='【アイコン】'){inIcon=true;continue}if(inIcon&&t.startsWith('【')){inIcon=false}if(inIcon&&t.includes(':http')){let u=t.substring(t.indexOf(':')+1).trim();if(u)c.iconUrls.push(u)}}
let memStart=lines.findIndex(x=>x.trim()==='【メモ】');if(memStart>=0){let end=lines.findIndex((x,i)=>i>memStart&&x.trim().startsWith('【'));if(end<0)end=lines.length;let memLines=lines.slice(memStart+1,end).map(x=>x.trim()).filter(Boolean);c.memo=memLines.join('\n');let fp=memLines.find(x=>x.startsWith('一人称'));let sp=memLines.find(x=>x.startsWith('二人称'));if(fp)c.firstPerson=fp.replace(/^一人称\s*/,'').trim();if(sp)c.secondPerson=sp.replace(/^二人称\s*/,'').trim();let bd=memLines.find(x=>/生まれ$/.test(x)&&/\d{1,2}\s*[\/月]\s*\d{1,2}/.test(x));if(bd){let bm=bd.match(/(\d{1,2})\s*[\/月]\s*(\d{1,2})/);if(bm)c.birthday=`${bm[1]}/${bm[2]}`}c.quotes=memLines.filter(x=>/^「.*」$/.test(x)).map(x=>x.replace(/^「|」$/g,''))}
c.initialData={age:c.age,job:c.job,gender:c.gender,height:c.height,weight:c.weight,birthplace:c.birthplace,hair:c.hair,eyes:c.eyes,firstPerson:c.firstPerson,secondPerson:c.secondPerson,memo:c.memo,quotes:[...(c.quotes||[])]};
let st=lines.findIndex(x=>x.trim()==='【能力値】');if(st>=0){let end=lines.findIndex((x,i)=>i>st&&x.trim().startsWith('【'));if(end<0)end=lines.length;for(const l of lines.slice(st+1,end)){let x=l.trim().match(/^([^\s]+)\s+(\d+)/);if(x&&['STR','CON','POW','DEX','APP','SIZ','INT','EDU','HP','MP','正気度','IDE','幸運','知識'].includes(x[1]))c.stats.push({name:x[1],value:x[2]})}}
let sanLine=lines.find(x=>/^\s*正気度\s+\d+\s*\/\s*\d+/.test(x.trim()))||'';let sanMatch=sanLine.trim().match(/^正気度\s+(\d+)\s*\/\s*(\d+)/);if(sanMatch){c.sanCurrent=sanMatch[1];c.sanMax=sanMatch[2];}c.stats=c.stats.filter(x=>x.name!=='正気度');c.initialStats=cloneStats(c.stats);c.initialData.stats=cloneStats(c.stats);c.statsHistory=[];
let sk=lines.findIndex(x=>x.trim()==='【技能値】');if(sk>=0){let end=lines.findIndex((x,i)=>i>sk&&x.trim().startsWith('【武器】'));if(end<0)end=lines.length;let category='その他';for(const l of lines.slice(sk,end)){let t=l.trim();let gm=t.match(/^『(.+技能)』$/);if(gm){category=SKILL_GROUPS.includes(gm[1])?gm[1]:'その他';continue}let x=t.match(/^(.+?)\s+(\d+)\s+\d+\s+\d+\s+\d+\s+\d+\s+\d+$/);if(x&&x[1]&&!/^(技能名|職業ポイント|興味ポイント|『|【)/.test(x[1]))c.skills.push({name:x[1].trim(),initialValue:x[2],value:x[2],category})}}
return c}
function renderImportPreview(c){let box=document.getElementById('importPreview');box.innerHTML=`<div class="section">読み込み結果</div><div class="card char-card"><div class="avatar">${c.iconUrls?.[0]?`<img src="${esc(c.iconUrls[0])}" alt="">`:'♙'}</div><div><b>${esc(c.name||'名前を取得できませんでした')}</b><div class="meta">${esc([c.job,(c.latestAge||c.age)&&((c.latestAge||c.age)+'歳'),c.gender,(c.latestHeight||c.height)&&((c.latestHeight||c.height)+'cm')].filter(Boolean).join(' / '))}</div><div class="meta">一人称：${esc(c.firstPerson||'—')}　 二人称：${esc(c.secondPerson||'—')}</div></div></div><div class="note" style="margin-top:10px">アイコン ${c.iconUrls.length}件 / 能力値 ${c.stats.length}件 / 技能 ${c.skills.length}件 / メモ ${c.memo? 'あり':'なし'} / セリフ例 ${c.quotes.length}件</div><div class="note" style="margin-top:7px">取り込み内容は初期設定として保存。あとから最新設定を追加できます。</div><button class="primary" onclick="confirmCharacterImport()">この内容で登録</button>`}
function confirmCharacterImport(){let c=window.pendingCharacter;if(!c?.name){toast('名前を読み取れませんでした');return}c.pairIds=currentPairId?[currentPairId]:[];c.pairRelations=c.pairRelations||{};c.birthday=c.birthday||'';c.imageColorHue=Number.isFinite(Number(c.imageColorHue))?Number(c.imageColorHue):270;c.imageColor=c.imageColor||hueToColor(c.imageColorHue);characters.push(c);save();window.pendingCharacter=null;closeModal();toast('キャラクターを登録しました');if(currentPairId)characterList(currentPairId);else globalCharacterList()}
function deleteCharacter(id){const c=characters.find(x=>x.id===id);if(!c)return;const ok=confirm(`「${c.name}」を削除しますか？\n\nこの操作は取り消せません。`);if(!ok)return;characters=characters.filter(x=>x.id!==id);pairs.forEach(p=>{if(Array.isArray(p.characters))p.characters=p.characters.filter(x=>x!==id);});save();toast('キャラクターを削除しました');if(currentPairId)characterList(currentPairId);else globalCharacterList()}
function closeModal(){document.getElementById('modal').style.display='none'}
function addPair(){let n=document.getElementById('pairName').value.trim();if(!n)return;let p={id:Date.now(),name:n,desc:document.getElementById('pairDesc').value.trim()||'ふたりの物語',date:new Date().toLocaleDateString('ja-JP'),characters:[]};pairs.push(p);save();closeModal();show('home');toast('うちよそを登録しました')}
try{initSupabase();}catch(e){
  console.error('Supabase初期化エラー:',e);
  const gate=document.getElementById('authGate');
  if(gate)gate.style.display='flex';
}
</script>
</body></html>
