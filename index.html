<script type="module">
window.__faceDetectorPromise = null;
window.loadFaceDetector = async function(){
  if(window.__faceDetectorPromise) return window.__faceDetectorPromise;
  window.__faceDetectorPromise = (async()=>{
    const vision = await import("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22");
    const fileset = await vision.FilesetResolver.forVisionTasks(
      "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/wasm"
    );
    return vision.FaceDetector.createFromOptions(fileset,{
      baseOptions:{
        modelAssetPath:"https://storage.googleapis.com/mediapipe-models/face_detector/blaze_face_short_range/float16/1/blaze_face_short_range.tflite",
        delegate:"GPU"
      },
      runningMode:"IMAGE",
      minDetectionConfidence:0.35
    });
  })();
  return window.__faceDetectorPromise;
};
window.detectFaceFocalPoint = async function(file){
  try{
    const detector=await window.loadFaceDetector();
    const bitmap=await createImageBitmap(file);
    const result=detector.detect(bitmap);
    bitmap.close();
    const detections=result?.detections||[];
    if(!detections.length) return null;
    let sx=0,sy=0,total=0;
    for(const d of detections){
      const b=d.boundingBox;
      if(!b) continue;
      const score=(d.categories?.[0]?.score)||1;
      sx+=(b.originX+b.width/2)*score;
      sy+=(b.originY+b.height*0.58)*score;
      total+=score;
    }
    if(!total) return null;
    return {
      x:Math.max(0,Math.min(100,sx/total/bitmap.width*100)),
      y:Math.max(0,Math.min(100,sy/total/bitmap.height*100)),
      faces:detections.length
    };
  }catch(e){
    console.warn("face focus detection failed",e);
    return null;
  }
};
</script>

async function initSupabase(){
  if(!window.supabase?.createClient) throw new Error('Supabaseライブラリを読み込めませんでした。ネット接続を確認してください。');
  const c=getSupabaseConfig();
  if(!c?.url||!c?.key){showAuthConfig();return false}
  try{
    // 接続設定画面ではネットワーク確認のためにgetSession()を待たない。
    // GitHub Pages上でセッション確認がハングすると、設定画面から進めなくなるため。
    supabaseClient=window.supabase.createClient(c.url,c.key,{auth:{autoRefreshToken:true,persistSession:true,detectSessionInUrl:true}});
    supabaseClient.auth.onAuthStateChange((_event,session)=>{currentUser=session?.user||null;updateAuthGate();});
    currentUser=null;
    updateAuthGate();
    // 保存済みセッションがある場合だけ、短いタイムアウトで復元を試みる。
    const sessionPromise=supabaseClient.auth.getSession();
    const timeoutPromise=new Promise(resolve=>setTimeout(()=>resolve({data:{session:null},error:null}),3000));
    const result=await Promise.race([sessionPromise,timeoutPromise]);
    if(result?.error) throw result.error;
    currentUser=result?.data?.session?.user||null;
    updateAuthGate();
    return true;
  }catch(e){setAuthMessage('configMsg','Supabaseの接続確認に失敗しました：'+(e.message||e));showAuthConfig();return false}
}
function updateAuthGate(){
  const gate=document.getElementById('authGate');
  if(!gate)return;
  if(currentUser){
    gate.style.display='none';
    // 初回ログイン時だけホームを表示。
    // メール確認・トークン更新などのAuthイベントでは現在の画面を維持する。
    if(!appReady){appReady=true;show('home');setTimeout(async()=>{await sessionLogStorageReady;await loadSharedPairs({refreshView:false});await loadSharedCharacters({refreshView:false});await loadSharedSessionLogs({refreshView:false});await hydrateSessionLogBlobs();await loadSharedSS({refreshView:false});await loadSharedMatrices();await loadSharedAnniversaries();show('home');},0);}
  }else{
    appReady=false;

  }
}

  if(!/^https:\/\/[^\s]+\.supabase\.co$/.test(url)){setAuthMessage('configMsg','Project URLの形式を確認してね。');return}

async function submitAuth(){
  if(!supabaseClient){setAuthMessage('authMsg','先にSupabase接続設定をしてください。');return}
  const email=document.getElementById('authEmail').value.trim();const password=document.getElementById('authPassword').value;
  if(!email||!password){setAuthMessage('authMsg','メールアドレスとパスワードを入力してね。');return}
  if(password.length<6){setAuthMessage('authMsg','パスワードは6文字以上にしてね。');return}
  setAuthMessage('authMsg','処理中…');
  try{
    if(authMode==='signup'){
      const {data,error}=await supabaseClient.auth.signUp({email,password});
      if(error)throw error;
      if(data?.session){setAuthMessage('authMsg','登録しました。ログインしています…');}else{setAuthMessage('authMsg','登録完了！確認メールが届いたらメール内のリンクを開いてね。');}
    }else{
      const {data,error}=await supabaseClient.auth.signInWithPassword({email,password});
      if(error)throw error;currentUser=data?.user||null;updateAuthGate();
    }
  }catch(e){setAuthMessage('authMsg',authFriendlyError(e))}
}

async function hydrateSessionLogBlobs(){

async function migrateSessionLogsToIndexedDB(){

      if(!x?.id||!x?.logHtml)continue;
      await putSessionLogBlob(x.id,{logHtml:x.logHtml,updatedAt:x.updatedAt});

async function loadSharedSessionLogs(options={}){

    await loadSharedPairs({refreshView:false});
    const w=await getSharedWorkspace();if(!w?.id)return;
    const {data:remote,error}=await supabaseClient.from('session_logs').select('id,pair_id,scenario_name,played_at,log_html,data,created_by,updated_by,created_at,updated_at').eq('workspace_id',w.id).order('played_at',{ascending:false,nullsFirst:false}).order('created_at',{ascending:false});
    if(error)throw error;const rows=Array.isArray(remote)?remote:[];let changed=false;
    for(const row of rows){
      const d=(row.data&&typeof row.data==='object')?row.data:{};const localId=String(d.local_id||'');if(!localId)continue;
      const idx=sessionLogs.findIndex(x=>String(x.id)===localId);
      const pairId=d.local_pair_id||'';
      const remoteHtml=String(row.log_html??d.logHtml??'');
      const merged={...(idx>=0?sessionLogs[idx]:{}),...d,id:idx>=0?sessionLogs[idx].id:localId,supabaseId:row.id,pairId:pairId||sessionLogs[idx]?.pairId||'',scenarioName:String(row.scenario_name??d.scenarioName??''),playedAt:row.played_at||d.playedAt||'',logHtml:remoteHtml};
      if(remoteHtml)await putSessionLogBlob(merged.id,{logHtml:remoteHtml,updatedAt:row.updated_at||new Date().toISOString()});
      if(idx>=0)sessionLogs[idx]=merged;else sessionLogs.push(merged);changed=true;
    }
    const remoteIds=new Set(rows.map(r=>String(r.id)));
    if(rows.length===0){for(const x of [...sessionLogs]){if(!x?.id)continue;const ok=await syncSessionLogToSupabase(x);if(ok)changed=true;}}
    else{const before=sessionLogs.length;sessionLogs=sessionLogs.filter(x=>!x?.supabaseId||remoteIds.has(String(x.supabaseId)));if(sessionLogs.length!==before)changed=true;}
    if(changed)saveSessionLogs();

  finally{sessionLogSyncBusy=false;}
}

function normalizeSessionChannel(raw,label){
  const c=String(raw||'').trim().toLowerCase();
  const l=String(label||'').replace(/\s+/g,'').trim().toLowerCase();
  // CCFOLIA/旧形式: [main] = 本編、[other] = 雑談、[info] = 本編扱い。
  // 新形式: data-channel="other" = 雑談。
  if(c==='other'||c==='雑談'||c==='chat')return 'other';

  if(c==='main'||c==='メイン'||c==='info'||c==='information')return 'main';

function parseSessionLogHtml(html){

function characterForLogSpeaker(name){

function findStandingForCharacter(c){

function normalizeMatchText(v){return String(v||'').replace(/[\s　]/g,'').replace(/[「」『』【】［］\[\]()（）・]/g,'').toLowerCase()}
async function hydrateSessionAvatars(){
  const nodes=[...document.querySelectorAll('[data-session-speaker]')];

      const ids=(pair?.characterIds||[]).map(String);
      const pairStanding=gallery.filter(g=>g.type==='standing'&&String(g.pairId||'')===String(currentPairId));

function sortedReportsWithTableNumbers(pairId,sort='desc'){

  const numberMap=new Map(dated.map((r,i)=>[String(r.id),i+1]));

async function loadWorkspace(){
  if(!supabaseClient||!currentUser){currentWorkspace=null;return null;}
  if(currentWorkspace?.id&&currentWorkspace.owner_id){
    return currentWorkspace;
  }
  try{
    const {data,error}=await supabaseClient
      .from('workspace_members')
      .select('workspace_id,role,workspaces(id,name,invite_code,owner_id)')
      .eq('user_id',currentUser.id)
      .limit(1)
      .maybeSingle();
    if(error)throw error;
    const w=data?.workspaces||null;
    if(w){
      currentWorkspace=w;
      localStorage.setItem(WORKSPACE_KEY,JSON.stringify(w));
      return w;
    }
  }catch(e){
    console.error('ワークスペース取得エラー:',e);
  }
  return null;
}

async function getPairThumbnailUrl(p){
  if(!p?.thumbnail)return '';
  const cacheKey=String(p.id);
  const cached=pairThumbUrlCache.get(cacheKey);
  if(cached)return cached;
  try{
    if(p.thumbnail.storagePath&&supabaseClient&&currentUser){
      const {data,error}=await supabaseClient.storage.from('uchiyoso-images').createSignedUrl(p.thumbnail.storagePath,3600);
      if(!error&&data?.signedUrl){pairThumbUrlCache.set(cacheKey,data.signedUrl);return data.signedUrl;}
    }
    if(p.thumbnail.localKey){
      const blob=await getGalleryBlob(p.thumbnail.localKey);
      if(blob){const url=URL.createObjectURL(blob);pairThumbUrlCache.set(cacheKey,url);return url;}
    }
  }catch(e){console.error('うちよそサムネイル読み込みエラー:',e)}
  return '';
}

async function syncPairToSupabase(p){
  if(!supabaseClient||!currentUser||!p)return false;
  const w=await getSharedWorkspace();
  if(!w?.id)return false;
  try{
    const localId=String(p.id);
    const {data:existing,error:findError}=await supabaseClient
      .from('pairs')
      .select('id')
      .eq('workspace_id',w.id)
      .filter('data->>local_id','eq',localId)
      .maybeSingle();
    if(findError)throw findError;
    const payload={
      workspace_id:w.id,
      name:String(p.name||''),
      description:String(p.desc||''),
      display_date:String(p.date||''),
      data:sharedPairData(p)
    };
    if(existing?.id){
      const {error}=await supabaseClient.from('pairs').update(payload).eq('id',existing.id);
      if(error)throw error;
      p.supabaseId=existing.id;
    }else{
      const {data,error}=await supabaseClient.from('pairs').insert(payload).select('id').single();
      if(error)throw error;
      p.supabaseId=data?.id||null;
    }
    return true;
  }catch(e){
    console.error('うちよそ共有保存エラー:',e);
    return false;
  }
}
async function loadSharedPairs(options={}){
  if(pairSyncBusy||!supabaseClient||!currentUser)return;
  pairSyncBusy=true;
  try{
    const w=await getSharedWorkspace();
    if(!w?.id)return;
    const {data:remote,error}=await supabaseClient
      .from('pairs')
      .select('id,name,description,display_date,data,created_at,updated_at')
      .eq('workspace_id',w.id)
      .order('created_at',{ascending:true});
    if(error)throw error;
    const rows=Array.isArray(remote)?remote:[];
    let changed=false;
    const remoteIds=new Set();
    for(const row of rows){
      const d=(row.data&&typeof row.data==='object')?row.data:{};
      const localId=String(d.local_id||'');
      if(!localId)continue;
      remoteIds.add(localId);
      const idx=pairs.findIndex(p=>String(p.id)===localId);
      const oldThumbPath=idx>=0?pairs[idx]?.thumbnail?.storagePath||'':'';
      const newThumbPath=d?.thumbnail?.storagePath||'';
      if(oldThumbPath!==newThumbPath)pairThumbUrlCache.delete(localId);
      const merged={
        ...(idx>=0?pairs[idx]:{}),
        ...d,
        id:idx>=0?pairs[idx].id:localId,
        name:String(row.name||d.name||''),
        desc:String(row.description??d.desc??''),
        date:String(row.display_date??d.date??''),
        supabaseId:row.id,
        characters:Array.isArray(d.characters)?d.characters:((idx>=0&&Array.isArray(pairs[idx].characters))?pairs[idx].characters:[])
      };
      if(idx>=0)pairs[idx]=merged;else pairs.push(merged);
      changed=true;
    }
    // 共有ワークスペースにまだうちよそがない場合だけ、既存の端末データを初回共有する。
    // 参加側の初期サンプルを勝手に共有してしまわないため、リモートに1件でもあればローカル未共有分は送らない。
    if(rows.length===0){
      for(const p of [...pairs]){
        if(!p?.id||remoteIds.has(String(p.id)))continue;
        const ok=await syncPairToSupabase(p);
        if(ok)changed=true;
      }
    }else{
      // 共有済みのうちよそがSupabase側で削除された場合、
      // このブラウザに残っている古いローカル表示も取り除く。
      const before=pairs.length;
      pairs=pairs.filter(p=>{
        if(!p?.supabaseId)return true;
        return rows.some(r=>String(r.id)===String(p.supabaseId));
      });
      if(pairs.length!==before)changed=true;
    }
    if(changed)save();
    if(options.refreshView)show('home');
  }catch(e){
    console.error('共有うちよそ読み込みエラー:',e);
    if(options.showError)toast('共有うちよその読み込みに失敗しました');
  }finally{
    pairSyncBusy=false;
  }
}

async function loadSharedCharacters(options={}){
  if(characterSyncBusy||!supabaseClient||!currentUser)return;
  characterSyncBusy=true;
  try{
    await loadSharedPairs({refreshView:false});
    const w=await getSharedWorkspace();
    if(!w?.id)return;
    const {data:remote,error}=await supabaseClient
      .from('characters')
      .select('id,name,data,created_by,updated_by,created_at,updated_at')
      .eq('workspace_id',w.id)
      .order('created_at',{ascending:true});
    if(error)throw error;
    const rows=Array.isArray(remote)?remote:[];
    let changed=false;
    const remoteIds=new Set();
    for(const row of rows){
      const d=(row.data&&typeof row.data==='object')?row.data:{};
      const localId=String(d.local_id||'');
      if(!localId)continue;
      remoteIds.add(localId);
      const idx=characters.findIndex(c=>String(c.id)===localId);
      const merged={...d,supabaseId:row.id};

        characters[idx]={...characters[idx],...merged};

    for(const c of [...characters]){
      if(!c?.id||remoteIds.has(String(c.id)))continue;
      const ok=await syncCharacterToSupabase(c);
      if(ok)changed=true;
    }
    if(changed)save();
    if(options.refreshView)refreshCurrentCharacterView();
  }catch(e){
    console.error('共有キャラクター読み込みエラー:',e);

  }finally{

  }

function attachMatrixDrag(node,board,m){
  let dragging=false;const move=e=>{if(!dragging)return;const r=board.getBoundingClientRect();let x=((e.clientX-r.left)/r.width)*100,y=((e.clientY-r.top)/r.height)*100;x=Math.max(5,Math.min(95,x));y=Math.max(7,Math.min(93,y));node.style.left=x+'%';node.style.top=y+'%';const p=m.positions.find(v=>String(v.id)===String(node.dataset.id));if(p){p.x=x;p.y=y;m.updatedAt=new Date().toISOString()}};const up=()=>{if(!dragging)return;dragging=false;node.classList.remove('dragging');document.removeEventListener('pointermove',move);document.removeEventListener('pointerup',up);saveMatrices();syncMatrixToSupabase(m)};node.addEventListener('pointerdown',e=>{e.preventDefault();dragging=true;node.classList.add('dragging');document.addEventListener('pointermove',move);document.addEventListener('pointerup',up)})}

function annivDateParts(a){const d=String(a?.date||a?.anniversaryDate||'');const m=d.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);if(m)return {year:Number(m[1]),month:Number(m[2]),day:Number(m[3])};return {year:null,month:Number(a?.month||0),day:Number(a?.day||0)}}

function annivRelatedName(a){const c=a?.characterId&&characters.find(x=>String(x.id)===String(a.characterId));return c?.name||''}
function annivNextOccurrence(a,base=new Date()){const p=annivDateParts(a);if(!p.month||!p.day)return null;const yearly=a.repeatYearly!==false;if(!yearly&&p.year){const d=new Date(p.year,p.month-1,p.day);d.setHours(0,0,0,0);return d}let y=base.getFullYear();let d=new Date(y,p.month-1,p.day);d.setHours(0,0,0,0);const b=new Date(base);b.setHours(0,0,0,0);if(d<b)d=new Date(y+1,p.month-1,p.day);d.setHours(0,0,0,0);return d}
function annivDaysUntil(d,base=new Date()){if(!d)return null;const b=new Date(base);b.setHours(0,0,0,0);return Math.round((d-b)/86400000)}
function annivDateLabel(a){const p=annivDateParts(a);if(!p.month||!p.day)return '日付未設定';return a.repeatYearly!==false?`${p.month}月${p.day}日`:`${p.year}年${p.month}月${p.day}日`}

function applyGalleryObjectPosition(img,focusX,focusY){
  if(!img||!img.naturalWidth||!img.naturalHeight)return;
  const cw=img.clientWidth,ch=img.clientHeight;if(!cw||!ch)return;
  const scale=Math.max(cw/img.naturalWidth,ch/img.naturalHeight);const ow=img.naturalWidth*scale,oh=img.naturalHeight*scale;
  const fx=Math.max(0,Math.min(100,Number.isFinite(focusX)?focusX:50))/100,fy=Math.max(0,Math.min(100,Number.isFinite(focusY)?focusY:50))/100;
  const px=Math.abs(ow-cw)<.01?50:Math.max(0,Math.min(100,(fx*ow-cw/2)/(ow-cw)*100));const py=Math.abs(oh-ch)<.01?50:Math.max(0,Math.min(100,(fy*oh-ch/2)/(oh-ch)*100));img.style.objectPosition=`${px}% ${py}%`;
}

function setupFocusEditor(id){

  if(!w||!h)return;
  st.side=Math.min(w,h);st.maxLeft=Math.max(0,w-st.side);st.maxTop=Math.max(0,h-st.side);
  const x=Number.isFinite(gallery.find(g=>g.id===id)?.focusX)?gallery.find(g=>g.id===id).focusX:50;
  const y=Number.isFinite(gallery.find(g=>g.id===id)?.focusY)?gallery.find(g=>g.id===id).focusY:50;
  const left=Math.max(0,Math.min(st.maxLeft,w*x/100-st.side/2));
  const top=Math.max(0,Math.min(st.maxTop,h*y/100-st.side/2));
  frame.style.width=st.side+'px';frame.style.height=st.side+'px';frame.style.left=left+'px';frame.style.top=top+'px';
  updateFocusCoords();
  frame.onpointerdown=(e)=>{
    e.preventDefault();st.dragging=true;st.startX=e.clientX;st.startY=e.clientY;st.startLeft=parseFloat(frame.style.left)||0;st.startTop=parseFloat(frame.style.top)||0;frame.setPointerCapture?.(e.pointerId);
  };
  frame.onpointermove=(e)=>{
    if(!st.dragging)return;e.preventDefault();
    const nx=Math.max(0,Math.min(st.maxLeft,st.startLeft+e.clientX-st.startX));
    const ny=Math.max(0,Math.min(st.maxTop,st.startTop+e.clientY-st.startY));
    frame.style.left=nx+'px';frame.style.top=ny+'px';updateFocusCoords();
  };

  frame.onpointerup=stop;frame.onpointercancel=stop;frame.onlostpointercapture=stop;
  stage.onclick=(e)=>{
    if(st.dragging)return;
    if(e.target===frame||frame.contains(e.target))return;
    const r=stage.getBoundingClientRect();

async function deletePair(id){
  const p=pairs.find(x=>String(x.id)===String(id));if(!p)return;
  id=p.id;
  const ok=confirm(`「${p.name}」を削除しますか？\n\nこのうちよそを削除します。\nキャラクター自体は削除されません。`);
  if(!ok)return;
  if(p.thumbnail?.localKey){try{await deleteGalleryBlob(p.thumbnail.localKey)}catch(e){}}
  await deletePairThumbnailStorage(p);
  pairThumbUrlCache.delete(String(p.id));
  if(supabaseClient&&currentUser){
    try{
      // 現在のローカル状態ではなく、Supabase上の共有ワークスペースを取り直す。
      const w=await getSharedWorkspace();
      if(!w?.id)throw new Error('共有ワークスペースが見つかりません');
      let remotePairId=p.supabaseId||null;
      // 共有IDがローカルに付いていない場合も、local_idから共有行を特定する。
      if(!remotePairId){
        const {data:found,error:findError}=await supabaseClient
          .from('pairs').select('id').eq('workspace_id',w.id)
          .filter('data->>local_id','eq',String(id)).maybeSingle();
        if(findError)throw findError;
        remotePairId=found?.id||null;
      }
      if(remotePairId){
        // セッションログは pair_id が on delete set null なので、
        // ログ削除に失敗しても「うちよそ本体」の削除を妨げない。
        // 削除権限を確実にワークスペースメンバー共通にするため、
        // SECURITY DEFINER のRPCで共有うちよそを削除する。
        // まず専用RPCで削除。RPCが未作成・古い場合は、通常のDELETEへフォールバックする。
        let deleted=false;
        let rpcError=null;
        try{
          const {data,error}=await supabaseClient.rpc('delete_pair_by_id',{p_pair_id:remotePairId});
          rpcError=error||null;
          deleted=(data===true);
        }catch(e){
          rpcError=e;
        }
        if(!deleted){
          const {data:deletedRows,error:deleteError}=await supabaseClient
            .from('pairs').delete().eq('id',remotePairId).eq('workspace_id',w.id).select('id');
          if(deleteError){
            console.error('RPC削除エラー:',rpcError);
            throw deleteError;
          }
          deleted=Array.isArray(deletedRows)&&deletedRows.length>0;
        }
        if(!deleted)throw new Error('共有うちよその削除対象を確認できませんでした');
      }
    }catch(e){
      console.error('共有うちよそ削除エラー:',e);
      toast('共有側の削除に失敗しました');
      return;
    }
  }
  pairs=pairs.filter(x=>String(x.id)!==String(id));
  const removedSessionLogs=sessionLogs.filter(x=>String(x.pairId)===String(id));
  sessionLogs=sessionLogs.filter(x=>String(x.pairId)!==String(id));
  for(const log of removedSessionLogs){await deleteSessionLogBlob(log.id);}
  saveSessionLogs();
  characters.forEach(c=>{if(Array.isArray(c.pairIds))c.pairIds=c.pairIds.filter(x=>String(x)!==String(id));if(c.pairRelations)delete c.pairRelations[String(id)]});
  save();
  currentPairId=null;
  show('home');
  toast('うちよそを削除しました');
}

function closeModal(){document.getElementById('modal').style.display='none'}
function pairCharacterIds(p){
  const ids=Array.isArray(p?.characterIds)?p.characterIds.map(String).filter(Boolean):[];
  if(ids.length)return ids;
  return characters.filter(c=>(c.pairIds||[]).some(x=>String(x)===String(p?.id))).map(c=>String(c.id));
}
async function openPairEdit(id){
  const p=pairs.find(x=>String(x.id)===String(id));if(!p)return;
  currentPairId=p.id;const ids=pairCharacterIds(p);
  const opts=characters.length?characters.map(c=>`<option value="${esc(String(c.id))}" ${String(ids[0])===String(c.id)?'selected':''}>${esc(c.name||'名前未設定')}</option>`).join(''):'<option value="">登録済みキャラクターがありません</option>';
  const opts2=characters.length?characters.map(c=>`<option value="${esc(String(c.id))}" ${String(ids[1])===String(c.id)?'selected':''}>${esc(c.name||'名前未設定')}</option>`).join(''):'<option value="">登録済みキャラクターがありません</option>';
  document.getElementById('sheet').innerHTML=`<button class="close" onclick="closeModal()">×</button><h2>うちよそを編集</h2><div class="field"><label>うちよその名前</label><input id="editPairName" value="${esc(p.name||'')}" placeholder="例：カナタ × レイ"></div><div class="field"><label>ひとこと</label><input id="editPairDesc" value="${esc(p.desc||'')}" placeholder="例：世界の隅で、ふたり"></div><div class="field"><label>キャラクター1</label><select id="editPairCharA" style="width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink)"><option value="">選択しない</option>${opts}</select></div><div class="field"><label>キャラクター2</label><select id="editPairCharB" style="width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink)"><option value="">選択しない</option>${opts2}</select></div><div class="section">うちよそ専用サムネイル</div><div id="pairThumbEditPreview">${pendingPairThumbCrop?`<div class="pair-thumb-display pair-edit-thumb"><img src="${esc(URL.createObjectURL(pendingPairThumbCrop.blob))}" alt=""></div>`:pairThumbnailMarkup(p,'pair-edit-thumb')}</div><div class="field"><input id="pairThumbFile" type="file" accept="image/*"><div class="file-name" id="pairThumbFileName">${pendingPairThumbCrop?esc(pendingPairThumbCrop.fileName):''}</div></div><div class="row" style="gap:8px"><button class="secondary" type="button" id="pairThumbChangeBtn">画像を変更</button><button class="danger" type="button" style="margin-top:8px" id="pairThumbRemoveBtn">サムネイルを削除</button></div><div class="note">全身立ち絵などを選ぶと、続けて切り抜き画面が開きます。ドラッグと拡大スライダーでバストアップなど好きな範囲を選べます。切り抜いた画像はうちよそ専用サムネイルとして保存します。</div><button class="primary" id="savePairEditBtn">保存する</button>`;
  document.getElementById('modal').style.display='flex';
  const fileInput=document.getElementById('pairThumbFile');
  document.getElementById('pairThumbChangeBtn')?.addEventListener('click',()=>fileInput?.click());
  fileInput?.addEventListener('change',e=>{const f=e.target.files?.[0];if(f)openPairThumbCropEditor(f)});
  document.getElementById('pairThumbRemoveBtn')?.addEventListener('click',()=>removePairThumbnail(String(p.id)));
  document.getElementById('savePairEditBtn')?.addEventListener('click',()=>savePairEdit(String(p.id)));
  if(p.thumbnail)hydratePairThumbnail(p);
}

async function removePairThumbnail(id){
  const p=pairs.find(x=>String(x.id)===String(id));if(!p)return;
  if(!confirm('このうちよそ専用サムネイルを削除しますか？'))return;
  await deletePairThumbnailStorage(p);
  if(p.thumbnail?.localKey){try{await deleteGalleryBlob(p.thumbnail.localKey)}catch(e){}}
  p.thumbnail=null;pairThumbUrlCache.delete(String(p.id));save();
  if(supabaseClient&&currentUser&&currentWorkspace){const ok=await syncPairToSupabase(p);if(!ok){toast('削除はこの端末に保存しました（共有保存に失敗）');return;}}
  closeModal();pair(p.id);toast('うちよそ専用サムネイルを削除しました');
}
async function savePairEdit(id){
  const p=pairs.find(x=>String(x.id)===String(id));if(!p)return;
  const name=document.getElementById('editPairName')?.value.trim()||'';if(!name){toast('うちよその名前を入力してください');return}
  const a=document.getElementById('editPairCharA')?.value||'';const b=document.getElementById('editPairCharB')?.value||'';
  if(a&&b&&a===b){toast('同じキャラクターは2人分には選べません');return}
  const oldIds=pairCharacterIds(p);const selected=[a,b].filter(Boolean);const affected=new Set([...oldIds,...selected]);
  p.name=name;p.desc=document.getElementById('editPairDesc')?.value.trim()||'ふたりの物語';p.characterIds=selected;p.characters=[];
  characters.forEach(c=>{c.pairIds=Array.isArray(c.pairIds)?c.pairIds:[];if(selected.includes(String(c.id))){if(!c.pairIds.some(x=>String(x)===String(p.id)))c.pairIds.push(p.id)}else if(oldIds.includes(String(c.id))){c.pairIds=c.pairIds.filter(x=>String(x)!==String(p.id))}});
  const f=pendingPairThumbCrop?.blob ? new File([pendingPairThumbCrop.blob],pendingPairThumbCrop.fileName,{type:pendingPairThumbCrop.mime||pendingPairThumbCrop.blob.type||'image/png'}) : null;
  if(f){const ok=await savePairThumbnailFile(p,f);if(!ok&&supabaseClient&&currentUser&&currentWorkspace){toast('サムネイルの共有保存に失敗しました');return}}
  save();resetPairThumbCrop();closeModal();pair(p.id);
  if(supabaseClient&&currentUser&&currentWorkspace){const okPair=await syncPairToSupabase(p);let okChars=true;for(const cid of affected){const c=characters.find(x=>String(x.id)===String(cid));if(c&&!await syncCharacterToSupabase(c))okChars=false}save();toast(okPair&&okChars?'うちよそを更新しました（共有済み）':okPair?'うちよそを更新しました（キャラクター共有に一部失敗）':'うちよそを更新しました（共有保存に失敗）');}else toast('うちよそを更新しました');
}
async function addPair(){let n=document.getElementById('pairName').value.trim();if(!n){toast('うちよその名前を入力してください');return}let aId=document.getElementById('pairCharA')?.value||'';let bId=document.getElementById('pairCharB')?.value||'';if(aId&&bId&&aId===bId){toast('同じキャラクターは2人分には選べません');return}let selected=[aId,bId].filter(Boolean);let p={id:Date.now(),name:n,desc:document.getElementById('pairDesc').value.trim()||'ふたりの物語',date:new Date().toLocaleDateString('ja-JP'),characters:[],characterIds:selected};pairs.push(p);characters.forEach(c=>{if(selected.includes(String(c.id))){c.pairIds=Array.isArray(c.pairIds)?c.pairIds:[];if(!c.pairIds.some(x=>String(x)===String(p.id)))c.pairIds.push(p.id)}});save();closeModal();show('home');if(supabaseClient&&currentUser&&currentWorkspace){const okPair=await syncPairToSupabase(p);let okChars=true;for(const id of selected){const c=characters.find(x=>String(x.id)===String(id));if(c&&!await syncCharacterToSupabase(c))okChars=false}save();if(okPair&&okChars)toast('うちよそを登録しました（キャラクターも共有済み）');else if(okPair)toast('うちよそを登録しました（キャラクター共有に一部失敗）');else toast('うちよそを登録しました（共有保存に失敗）')}else toast('うちよそを登録しました')}
window.pair=pair;
window.characterList=characterList;
window.renderSessionLogs=renderSessionLogs;
window.renderGallery=renderGallery;
window.openPairEdit=openPairEdit;
window.showPairWallChat=showPairWallChat;
try{initSupabase();}catch(e){
  console.error('Supabase初期化エラー:',e);
  const gate=document.getElementById('authGate');
  if(gate)gate.style.display='flex';
}
</script>
</body></html>
